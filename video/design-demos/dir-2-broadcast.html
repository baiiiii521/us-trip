<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向二 90 年代转播</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+SC:wght@700;900&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #050A1E; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: #0B1640; }
  .layer { position: absolute; inset: 0; }
  .bg { background: radial-gradient(90% 55% at 50% 38%, #24418F 0%, #0B1640 55%, #040818 100%); }
  .beam { position: absolute; left: 50%; top: -200px; width: 1400px; height: 2400px; margin-left: -700px; transform-origin: 50% 0;
    background: conic-gradient(from 180deg at 50% 0%, transparent 0deg 168deg, rgba(190,215,255,.22) 172deg 188deg, transparent 192deg 360deg); mix-blend-mode: screen; }
  .courtwrap { position: absolute; left: -660px; right: -660px; bottom: -200px; height: 1100px; perspective: 900px; perspective-origin: 50% 0; }
  .court { position: absolute; inset: 0; transform: rotateX(62deg); transform-origin: 50% 100%;
    background-color: #B97835;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.09) 0 3px, transparent 3px 120px), linear-gradient(180deg, #D79A55, #8E5524);
    box-shadow: inset 0 200px 260px rgba(11,22,64,.95); }
  .court::before { content: ""; position: absolute; left: 50%; top: 18%; width: 760px; height: 760px; margin-left: -380px; border: 10px solid rgba(255,255,255,.75); border-radius: 50%; }
  .court::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; margin-left: -5px; background: rgba(255,255,255,.75); }
  .title { position: absolute; left: 0; right: 0; top: 520px; text-align: center; transform-origin: 50% 50%; }
  .chrome { display: block; font-family: "Anton", sans-serif; font-style: normal; line-height: .92; letter-spacing: .01em;
    background: linear-gradient(180deg, #FFFFFF 0%, #DCE3EE 34%, #6A7891 49%, #F6F8FB 52%, #A7B4C6 76%, #FFFFFF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 4px #0B1640;
    filter: drop-shadow(0 10px 0 #D7263D) drop-shadow(0 26px 30px rgba(0,0,0,.55)); }
  .skew { transform: skewX(-10deg); display: inline-block; }
  .l1 { font-size: 168px; } .l2 { font-size: 330px; }
  .fringe { position: absolute; inset: 0; mix-blend-mode: screen; opacity: .5; }
  .bar { position: absolute; left: 90px; right: 90px; height: 128px; background: #D7263D; transform: skewX(-10deg); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 6px #F5B700; }
  .bar span { transform: skewX(10deg); font-family: "Noto Sans SC", sans-serif; font-weight: 900; font-size: 52px; color: #fff; letter-spacing: .02em; white-space: nowrap; }
  .star { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .sb { position: absolute; left: 70px; right: 70px; height: 210px; display: grid; grid-template-columns: 250px 1fr 210px; transform: skewX(-10deg);
    background: linear-gradient(90deg, #0E1E55, #1C3480); box-shadow: 0 0 0 5px #F5B700, 0 30px 40px rgba(0,0,0,.45); }
  .sb > div { display: flex; align-items: center; justify-content: center; }
  .sb .d { background: #F5B700; color: #0B1640; font-family: "Anton", sans-serif; font-size: 92px; }
  .sb .m { color: #fff; font-family: "Noto Sans SC", sans-serif; font-weight: 900; font-size: 74px; }
  .sb .tm { background: #D7263D; color: #fff; font-family: "Anton", sans-serif; font-size: 80px; }
  .sb > div > * { transform: skewX(10deg); }
  .head { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
  .scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 5px); mix-blend-mode: multiply; }
  .vig { background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%); }
  .whip { background: #0B1640; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer bg"></div>
  <div class="beam" id="beam1"></div><div class="beam" id="beam2"></div>
  <div class="courtwrap"><div class="court" id="court"></div></div>
  <div id="sceneA" class="layer">
    <svg class="star" viewBox="0 0 1080 1920" id="star">
      <defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#F5B700" stop-opacity="0"/><stop offset="1" stop-color="#F5B700"/></linearGradient></defs>
      <path id="swoosh" d="M-200 760 C 200 640, 520 600, 820 470" stroke="url(#sw)" stroke-width="34" fill="none" stroke-linecap="round"/>
      <g id="starG"><path d="M0-90 26-28 92-28 39 12 59 76 0 38-59 76-39 12-92-28-26-28z" fill="#F5B700" stroke="#fff" stroke-width="6"/></g>
    </svg>
    <div class="title" id="title">
      <div class="skew"><span class="chrome l1">EAST COAST</span><span class="chrome l2">HOOPS</span></div>
    </div>
    <div class="bar" id="barA" style="top:1180px"><span>美东圣诞篮球行 12.18 — 12.31</span></div>
  </div>
  <div id="sceneB" class="layer">
    <div class="head" id="headB"><span class="skew"><span class="chrome" style="font-size:200px">3 <span style="font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:.82em">场</span> NBA</span></span></div>
    <div class="sb" id="c1" style="top:760px"><div class="d"><span>12.22</span></div><div class="m"><span>奇才 vs 猛龙</span></div><div class="tm"><span>7:00</span></div></div>
    <div class="sb" id="c2" style="top:1030px"><div class="d"><span>12.23</span></div><div class="m"><span>76人 vs 火箭</span></div><div class="tm"><span>7:30</span></div></div>
    <div class="sb" id="c3" style="top:1300px"><div class="d"><span>12.26</span></div><div class="m"><span>篮网 vs 鹈鹕</span></div><div class="tm"><span>6:00</span></div></div>
  </div>
  <div class="layer whip" id="whip"></div>
  <div class="layer scan"></div>
  <div class="layer vig"></div>
</div>
<script type="module">
import { makeStage, prog, ease, lerp, clamp } from '../lib/stage.js';
const $ = (id) => document.getElementById(id);
const CUT = 2.0;
function render(t) {
  $('beam1').style.transform = `rotate(${Math.sin(t * 1.4) * 24 - 8}deg)`;
  $('beam2').style.transform = `rotate(${Math.sin(t * 1.1 + 2) * 26 + 10}deg)`;
  $('court').style.backgroundPosition = `${-t * 160}px 0, 0 0`;
  const inA = t < CUT;
  $('sceneA').style.display = inA ? 'block' : 'none';
  $('sceneB').style.display = inA ? 'none' : 'block';
  if (inA) {
    // 星形划光飞入
    const ks = ease.out(prog(t, 0, .55));
    const sx = lerp(-150, 820, ks), sy = lerp(800, 470, ks);
    $('starG').setAttribute('transform', `translate(${sx} ${sy}) rotate(${ks * 360}) scale(${lerp(.6, 1.3, ks)})`);
    $('swoosh').style.strokeDasharray = '1400'; $('swoosh').style.strokeDashoffset = String(1400 * (1 - ks));
    $('swoosh').style.opacity = 1 - prog(t, .9, 1.4);
    // 镀铬大字冲镜
    const kz = ease.expoOut(prog(t, .25, 1.0));
    const sc = lerp(3.2, 1, kz);
    $('title').style.opacity = prog(t, .25, .35);
    $('title').style.transform = `scale(${sc}) translateY(${(1 - kz) * -60}px)`;
    $('title').style.filter = kz < .98 ? `blur(${(1 - kz) * 10}px)` : 'none';
    const kb = ease.out(prog(t, .95, 1.3));
    $('barA').style.clipPath = `inset(0 ${(1 - kb) * 100}% 0 0)`;
  } else {
    const tb = t - CUT;
    const kh = ease.out(prog(tb, 0, .4));
    $('headB').style.opacity = kh; $('headB').style.transform = `translateY(${(1 - kh) * -60}px)`;
    ['c1', 'c2', 'c3'].forEach((id, i) => {
      const k = ease.back(prog(tb, .25 + i * .22, .7 + i * .22));
      $(id).style.transform = `translateX(${(1 - k) * 1200}px) skewX(-10deg)`;
      $(id).style.filter = k < .95 ? `blur(${(1 - k) * 8}px)` : 'none';
    });
  }
  // 甩镜转场：一道深色擦过
  const w = t > CUT - .18 && t < CUT + .18 ? 1 - Math.abs(t - CUT) / .18 : 0;
  $('whip').style.opacity = w;
  $('stage').style.filter = w > .05 ? `blur(${w * 14}px)` : 'none';
}
makeStage({ dur: 4, render });
</script>
</body>
</html>
