<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向一 胶片抽帧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@500;900&family=IBM+Plex+Mono:wght@600&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #050807; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: #0B1F1E; }
  .layer { position: absolute; inset: 0; }
  .bg { background: radial-gradient(120% 70% at 70% 30%, #12403C 0%, #0B1F1E 45%, #050807 100%); }
  #bokeh { width: 1080px; height: 1920px; filter: blur(16px); opacity: .9; }
  .leak { background: radial-gradient(60% 40% at 0% 100%, rgba(255,120,40,.65), transparent 70%), radial-gradient(50% 30% at 100% 0%, rgba(255,59,48,.35), transparent 70%); mix-blend-mode: screen; }
  .gate { pointer-events: none; }
  .sprocket { position: absolute; top: -120px; bottom: -120px; width: 74px; background-color: #020303;
    background-image: linear-gradient(transparent 0 26px, rgba(241,230,207,.16) 26px 74px, transparent 74px 120px);
    background-size: 40px 120px; background-repeat: repeat-y; background-position: center 0; }
  .sprocket.l { left: 0; } .sprocket.r { right: 0; }
  .shake { position: absolute; inset: 0; }
  .neon { position: absolute; font-family: "Noto Serif SC", serif; font-weight: 900; writing-mode: vertical-rl; letter-spacing: .02em; line-height: 1; }
  .neon.main { color: #FF4A3D; text-shadow: 0 0 6px #FF8A7F, 0 0 26px #FF3B30, 0 0 80px rgba(255,59,48,.75); }
  .neon.ghost { color: #FF3B30; filter: blur(2px); }
  .sub { position: absolute; font-family: "Noto Sans SC", sans-serif; font-weight: 500; color: #F1E6CF; }
  .stamp { position: absolute; right: 120px; bottom: 150px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 54px; letter-spacing: .08em;
    color: #FF7A1A; text-shadow: 0 0 10px rgba(255,110,0,.8), 0 0 2px rgba(0,0,0,.8); }
  .ball { position: absolute; width: 230px; height: 230px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFB27A 0%, #F06A1C 45%, #9A3208 100%); box-shadow: 0 0 60px rgba(255,120,40,.5); }
  .ball svg { position: absolute; inset: 0; }
  .ball.ghost { box-shadow: none; filter: blur(3px); }
  .big { position: absolute; left: 120px; font-family: "Noto Sans SC", sans-serif; font-weight: 900; color: #F1E6CF; line-height: 1.05; }
  .date { position: absolute; left: 124px; font-family: "IBM Plex Mono", monospace; font-weight: 600; color: #FFB238; }
  .flash { background: #FFF6E5; opacity: 0; }
  #grain { width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: .55; }
  .vignette { background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div class="layer bg"></div>
  <canvas id="bokeh" class="layer"></canvas>
  <div class="layer leak" id="leak"></div>
  <div class="shake" id="shake">
    <!-- 第一镜：纽约 -->
    <div id="sceneA" class="layer">
      <div class="neon ghost" id="g3" style="font-size:440px;right:150px;top:250px">纽约</div>
      <div class="neon ghost" id="g2" style="font-size:440px;right:150px;top:250px">纽约</div>
      <div class="neon ghost" id="g1" style="font-size:440px;right:150px;top:250px">纽约</div>
      <div class="neon main" id="nA" style="font-size:440px;right:150px;top:250px">纽约</div>
      <div class="sub" id="subA" style="left:130px;top:1240px;font-size:60px;line-height:1.35">平安夜到纽约<br>连住 6 晚过圣诞</div>
      <div class="stamp" id="stampA">'26 12 24</div>
    </div>
    <!-- 第二镜：篮网 -->
    <div id="sceneB" class="layer">
      <div class="ball ghost" id="b4"></div><div class="ball ghost" id="b3"></div><div class="ball ghost" id="b2"></div><div class="ball ghost" id="b1"></div>
      <div class="ball" id="ball"><svg viewBox="0 0 230 230" fill="none" stroke="#3A1404" stroke-width="5"><circle cx="115" cy="115" r="112"/><path d="M3 115h224M115 3v224"/><path d="M38 36c26 20 38 46 38 79s-12 59-38 79M192 36c-26 20-38 46-38 79s12 59 38 79"/></svg></div>
      <div class="date" id="dateB" style="top:1100px;font-size:120px">12.26</div>
      <div class="big" id="bigB" style="top:1250px;font-size:150px">篮网 vs 鹈鹕</div>
      <div class="sub" id="subB" style="left:128px;top:1450px;font-size:50px;color:#C9D6CF">Barclays Center，18:00 开球</div>
      <div class="stamp" id="stampB">'26 12 26</div>
    </div>
  </div>
  <div class="gate layer"><div class="sprocket l" id="spL"></div><div class="sprocket r" id="spR"></div></div>
  <div class="layer vignette"></div>
  <canvas id="grain" class="layer"></canvas>
  <div class="layer flash" id="flash"></div>
</div>
<script type="module">
import { makeStage, makeGrain, prog, ease, step, lerp, rng, clamp } from '../lib/stage.js';
const $ = (id) => document.getElementById(id);

// 散景：确定性的光点
const bk = $('bokeh'); bk.width = 540; bk.height = 960; const bx = bk.getContext('2d');
const r = rng(7);
const COLORS = ['255,178,56', '255,59,48', '46,196,182', '255,240,220'];
const dots = Array.from({ length: 48 }, () => ({ x: r() * 540, y: r() * 960, rad: 10 + r() * 46, c: COLORS[Math.floor(r() * 4)], a: .25 + r() * .55, sp: .2 + r() * .8, ph: r() * 6.28 }));
function bokeh(t) {
  bx.clearRect(0, 0, 540, 960);
  for (const d of dots) {
    const y = (d.y - t * 30 * d.sp + 960) % 960;
    const a = d.a * (.75 + .25 * Math.sin(t * 2 + d.ph));
    bx.beginPath(); bx.fillStyle = `rgba(${d.c},${a})`; bx.arc(d.x + Math.sin(t + d.ph) * 8, y, d.rad, 0, 6.283); bx.fill();
  }
}
const grain = makeGrain($('grain'), { alpha: .5 });

const CUT = 1.75;
function render(t) {
  bokeh(t); grain(t);
  // 胶片前进：抽帧式移动
  const adv = step(t, 12) * 520;
  $('spL').style.backgroundPosition = `center ${adv}px`; $('spR').style.backgroundPosition = `center ${adv}px`;
  // 手持晃动
  const sx = Math.sin(t * 3.1) * 6 + Math.sin(t * 7.3) * 3, sy = Math.cos(t * 2.3) * 5, rot = Math.sin(t * 1.7) * .35;
  $('shake').style.transform = `translate(${sx}px,${sy}px) rotate(${rot}deg)`;
  $('leak').style.opacity = .55 + .35 * Math.sin(t * 1.3);

  const inA = t < CUT;
  $('sceneA').style.display = inA ? 'block' : 'none';
  $('sceneB').style.display = inA ? 'none' : 'block';

  if (inA) {
    // 霓虹字抽帧升起，带 3 层拖影
    const pos = (tt) => (1 - ease.out(prog(step(tt, 8), 0.05, 0.75))) * 420;
    const y0 = pos(t);
    $('nA').style.transform = `translateY(${y0}px)`;
    [['g1', 1, .38], ['g2', 2, .22], ['g3', 3, .12]].forEach(([id, k, o]) => {
      const yk = pos(t - k / 8);
      $(id).style.transform = `translateY(${yk}px)`;
      $(id).style.opacity = Math.abs(yk - y0) > 2 ? o : 0;
    });
    // 霓虹闪烁：确定性的两下
    const flick = (t > .62 && t < .7) || (t > .9 && t < .94) ? .35 : 1;
    $('nA').style.opacity = clamp(prog(t, 0, .1)) * flick;
    const s = ease.out(prog(t, .55, 1.0));
    $('subA').style.opacity = s; $('subA').style.transform = `translateX(${(1 - s) * -40}px)`;
    $('stampA').style.opacity = prog(t, .8, .82);
  } else {
    const tb = t - CUT;
    // 篮球斜穿画面，抽帧拖影
    const path = (tt) => { const k = ease.expoOut(prog(step(tt, 10), 0, .75)); return { x: lerp(-260, 690, k), y: lerp(1560, 380, k), rot: k * 540 }; };
    const p = path(tb);
    $('ball').style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.rot}deg)`;
    ['b1', 'b2', 'b3', 'b4'].forEach((id, i) => {
      const q = path(tb - (i + 1) * .06);
      $(id).style.transform = `translate(${q.x}px,${q.y}px) rotate(${q.rot}deg)`;
      $(id).style.opacity = Math.hypot(q.x - p.x, q.y - p.y) > 4 ? (.45 - i * .1) : 0;
    });
    const a = ease.out(prog(tb, .35, .7)), b = ease.out(prog(tb, .5, .85)), c = ease.out(prog(tb, .7, 1.0));
    $('dateB').style.opacity = a; $('dateB').style.transform = `translateY(${(1 - a) * 30}px)`;
    $('bigB').style.opacity = b; $('bigB').style.transform = `translateY(${(1 - b) * 40}px)`;
    $('subB').style.opacity = c;
    $('stampB').style.opacity = prog(tb, .9, .92);
  }
  // 闪白硬切
  const f = t >= CUT - .04 && t < CUT + .25 ? 1 - prog(t, CUT - .04, CUT + .25) : 0;
  $('flash').style.opacity = f * .95;
}
makeStage({ dur: 4, render });
</script>
</body>
</html>
