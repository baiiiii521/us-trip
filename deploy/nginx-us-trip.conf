# 美东圣诞行程页 trip.byb521.com —— 静态站（硅谷 43.153.33.188 / 海外主入口）
# 源站：49.233.168.199 走「默认线路」，海外访客走「境外线路」到这里
# 同步 API：/api/ 反代到 127.0.0.1:8796（us-trip-sync.service，只存客户端加密的密文）
server {
  listen 80;
  listen [::]:80;
  server_name trip.byb521.com;

  location /.well-known/acme-challenge/ { root /var/www/us-trip-acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name trip.byb521.com;

  ssl_certificate     /etc/letsencrypt/live/trip.byb521.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trip.byb521.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /var/www/us-trip;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # 私人行程，不进搜索引擎
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 哈希命名的资源可以长缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # service worker 和入口页必须每次回源，否则发版看不到
  location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # 两人云同步（密文存储）
  location /api/ {
    proxy_pass http://127.0.0.1:8796;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512k;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
