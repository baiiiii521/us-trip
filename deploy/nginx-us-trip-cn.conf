# 美东圣诞行程页（trip.byb521.com）—— 国内「默认线路」节点，静态站，站点根 /srv/trip/public
# 同一份构建也部署在硅谷 43.153.33.188（「境外线路」），海外访客走那台
# 云同步 /api/ 反代到硅谷：数据只有一份，两边不会分叉
# 证书：Let's Encrypt DNS-01（80 端口被腾讯云备案拦截，HTTP-01 不通），有效期到 2027-02-01，不自动续期
server {
  listen 80;
  server_name trip.byb521.com;
  location /.well-known/acme-challenge/ { root /srv/trip/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name trip.byb521.com;
  ssl_certificate     /etc/letsencrypt/live/trip.byb521.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trip.byb521.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /srv/trip/public;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;

  # 哈希命名的资源长缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  # 入口页与 service worker 每次回源
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }

  # 云同步：跨到硅谷那台（只存密文，几百字节）
  location /api/ {
    proxy_pass https://43.153.33.188;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name trip.byb521.com;
    proxy_set_header Host trip.byb521.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512k;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
